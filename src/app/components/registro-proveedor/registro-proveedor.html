<app-menu></app-menu>
<div class="container">

    <mat-toolbar color="primary">
        <span>Registra Proveedor</span>
    </mat-toolbar>
       <form [formGroup] ="forms" style="margin-top: 20px;">
         <div class="row">
            <div class="col-md-12">
                 <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Nombre</mat-label>
                    <input matInput formControlName="nombre"  placeholder="Ingresa tu nombre">
                </mat-form-field>
            </div>
         </div>
         <div class="row">
            <div class="col-md-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>DNI</mat-label>
                    <input matInput formControlName="dni"  placeholder="Ingresa tu DNI">
                </mat-form-field>
            </div>
            <div class="col-md-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Tipo</mat-label>
                    <mat-select formControlName="tipo">
                        <mat-option value="">[Seleccione ]</mat-option>
                        <mat-option *ngFor="let aux of listaTipo" [value]="aux.idTipo">
                            {{ aux.descripcion }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-md-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>País</mat-label>
                    <mat-select formControlName="pais">
                        <mat-option value="">[Seleccione ]</mat-option>
                        <mat-option *ngFor="let aux of listaPais" [value]="aux.idPais">
                            {{ aux.nombre }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
         </div>
         <div class="row">
            <div class="col-md-12 d-flex justify-content-center">
                <button mat-raised-button color="primary" type="button" 
                (click)="registrarProveedor()" >Enviar</button>
            </div>
         </div>
       </form>          
</div>
