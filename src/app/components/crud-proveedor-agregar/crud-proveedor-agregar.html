<div class="container">
    <form [formGroup]="forms">
       <div class="mat-dialog-content">

         <div class="row" >
            <mat-toolbar color="primary">
                <span>Registra Proveedor</span>
            </mat-toolbar>
         </div>
        
          <div class="row" style="margin-top: 30px;">
            <div class="col-md-12">
                 <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Nombre</mat-label>
                    <input matInput formControlName="nombre"  placeholder="Ingresa tu nombre">
                </mat-form-field>
            </div>
         </div>
         <div class="row">
            <div class="col-md-4">
                <mat-form-field appearance="outline" class="w-100" maxlength="8">
                    <mat-label>DNI</mat-label>
                    <input matInput formControlName="dni"  placeholder="Ingresa tu DNI">
                </mat-form-field>
            </div>
            <div class="col-md-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Tipo</mat-label>
                    <mat-select formControlName="tipo">
                        <mat-option value="-1">[Seleccione ]</mat-option>
                        <mat-option *ngFor="let aux of listaTipo" [value]="aux.idTipo">
                            {{ aux.descripcion }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-md-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>País</mat-label>
                    <mat-select formControlName="pais">
                        <mat-option value="-1">[Seleccione ]</mat-option>
                        <mat-option *ngFor="let aux of listaPais" [value]="aux.idPais">
                            {{ aux.nombre }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
         </div>
          <div class="row" style="margin-top: 3%; margin-left: auto; margin-right: auto; max-width: fit-content;">
                <div mat-dialog-actions style="display: flex; gap: 12px; justify-content: center;">
                    <button mat-raised-button 
                                    type="button" 
                                    color="primary" 
                                    [disabled]="forms.invalid"
                                    [mat-dialog-close]="1"
                                    (click)="registrarProveedor()">Registra
                    </button>
                    <button mat-raised-button 
                                    type="button" 
                                    color="primary"
                                    [mat-dialog-close]="2"    
                                    >Salir
                    </button>
                </div>
            </div>
       </div>
    </form>
</div>
